/.t3/projects/math-fonts/runs/entropy-2026-10-29/typotheque/prompt.txt">Exact prompt</a></p></figure><p>Three independent image concepts from the same retained-font reference. One generation per direction. The vector revision will use selected glyph ideas and preserve correct mathematical identities.</p><script>function show(id,button){document.querySelectorAll('figure').forEach(e=>e.hidden=e.id!==id);document.querySelectorAll('button').forEach(e=>e.setAttribute('aria-pressed',e===button))}</script></body></html>
